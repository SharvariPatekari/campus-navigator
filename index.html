<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Campus Navigator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #007bff, #00b894);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    

    p {
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background-color: white;
      color: #007bff;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #00b894;
      color: white;
    }

    .illustration {
      width: 300px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Welcome to Smart Campus Navigator</h1>
  <p>
    An interactive system that helps students and visitors easily find locations
    within the campus using smart mapping.
  </p>
  <a href="map.html" class="btn">Explore Map</a>

</body>
</html>
